<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гаманець">
<meta name="theme-color" content="#0d0d0f">
<title>Сімейний Гаманець</title>
<style>
  :root {
    --bg: #0d0d0f;
    --bg2: #16161a;
    --bg3: #1e1e24;
    --bg4: #26262e;
    --border: #2e2e38;
    --text: #f0f0f4;
    --text2: #9090a0;
    --text3: #5a5a70;
    --uah: #4a9eff;
    --uah-dim: rgba(74,158,255,0.12);
    --eur: #ffd234;
    --eur-dim: rgba(255,210,52,0.12);
    --usd: #34c774;
    --usd-dim: rgba(52,199,116,0.12);
    --danger: #ff4a6a;
    --danger-dim: rgba(255,74,106,0.12);
    --success: #34c774;
    --r: 14px;
    --r-sm: 8px;
    --tab-h: 72px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; overflow: hidden; }

  /* LAYOUT */
  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
  .screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 16px calc(var(--tab-h) + var(--safe-bottom) + 16px); scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
  .screen::-webkit-scrollbar { display: none; }

  /* TABS */
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--tab-h) + var(--safe-bottom)); background: rgba(13,13,15,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; z-index: 100; padding-bottom: var(--safe-bottom); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: var(--text3); transition: color .2s; padding-top: 4px; }
  .tab.active { color: var(--uah); }
  .tab svg { width: 22px; height: 22px; }
  .tab span { font-size: 10px; font-weight: 600; letter-spacing: 0.02em; }

  /* HEADER */
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .page-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .page-subtitle { font-size: 13px; color: var(--text2); margin-top: 2px; }

  /* CARDS */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
  .card-sm { padding: 12px 14px; }

  /* BALANCE SCREEN */
  .balance-total { background: linear-gradient(135deg, #16161a 0%, #1a1a22 100%); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 16px; position: relative; overflow: hidden; }
  .balance-total::before { content: ''; position: absolute; top: -40px; right: -40px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(74,158,255,0.08) 0%, transparent 70%); }
  .balance-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 16px; }
  .balance-currencies { display: flex; flex-direction: column; gap: 12px; }
  .balance-row { display: flex; align-items: center; justify-content: space-between; }
  .balance-currency-label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text2); }
  .cur-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .balance-amount { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .balance-amount.uah { color: var(--uah); }
  .balance-amount.eur { color: var(--eur); }
  .balance-amount.usd { color: var(--usd); }

  /* RATES */
  .rates-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .rate-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; }
  .rate-card-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .rate-symbol { font-size: 16px; font-weight: 700; }
  .rate-symbol.eur { color: var(--eur); }
  .rate-symbol.usd { color: var(--usd); }
  .rate-name { font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .rate-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .rate-row:last-child { margin-bottom: 0; }
  .rate-type { font-size: 11px; color: var(--text3); }
  .rate-val { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .rate-source { font-size: 10px; color: var(--text3); text-align: center; margin-top: 8px; }

  /* RECENT */
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 10px; }
  .txn-item { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background .15s, transform .1s; active: scale(0.98); }
  .txn-item:active { background: var(--bg3); transform: scale(0.99); }
  .txn-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .txn-icon.income { background: rgba(52,199,116,0.15); }
  .txn-icon.expense { background: rgba(255,74,106,0.15); }
  .txn-info { flex: 1; min-width: 0; }
  .txn-comment { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txn-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .txn-amount { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .txn-amount.income { color: var(--success); }
  .txn-amount.expense { color: var(--danger); }

  /* ADD SCREEN */
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 4px; margin-bottom: 16px; gap: 4px; }
  .type-btn { padding: 12px; border-radius: calc(var(--r) - 4px); border: none; background: transparent; color: var(--text2); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .type-btn.active.income { background: rgba(52,199,116,0.18); color: var(--success); }
  .type-btn.active.expense { background: rgba(255,74,106,0.18); color: var(--danger); }

  .cur-toggle { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 4px; margin-bottom: 16px; gap: 4px; }
  .cur-btn { padding: 10px; border-radius: calc(var(--r) - 4px); border: none; background: transparent; color: var(--text2); font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s; }
  .cur-btn.active[data-cur="UAH"] { background: var(--uah-dim); color: var(--uah); }
  .cur-btn.active[data-cur="EUR"] { background: var(--eur-dim); color: var(--eur); }
  .cur-btn.active[data-cur="USD"] { background: var(--usd-dim); color: var(--usd); }

  .field-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 7px; }
  .field-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 13px 14px; color: var(--text); font-size: 16px; outline: none; transition: border-color .2s; -webkit-appearance: none; }
  .field-input:focus { border-color: var(--uah); }
  .field-group { margin-bottom: 14px; }
  .amount-input { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; text-align: center; padding: 16px; }

  .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .member-btn { padding: 10px 6px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--bg3); color: var(--text2); font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; transition: all .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .member-btn.active { border-color: var(--uah); background: var(--uah-dim); color: var(--uah); }

  .btn-primary { width: 100%; padding: 16px; border-radius: var(--r); border: none; background: var(--uah); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 0.02em; transition: opacity .2s, transform .1s; }
  .btn-primary:active { opacity: 0.85; transform: scale(0.99); }
  .btn-primary.expense { background: var(--danger); }
  .btn-primary.income { background: var(--success); }

  /* HISTORY SCREEN */
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all .2s; flex-shrink: 0; }
  .filter-chip.active { background: var(--uah-dim); border-color: var(--uah); color: var(--uah); }
  .filter-chip.active[data-val="EUR"] { background: var(--eur-dim); border-color: var(--eur); color: var(--eur); }
  .filter-chip.active[data-val="USD"] { background: var(--usd-dim); border-color: var(--usd); color: var(--usd); }
  .filter-chip.active[data-val="income"] { background: rgba(52,199,116,0.12); border-color: var(--success); color: var(--success); }
  .filter-chip.active[data-val="expense"] { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 15px; }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* MONTHS SCREEN */
  .month-group { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
  .month-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; }
  .month-title { font-size: 15px; font-weight: 700; }
  .month-badges { display: flex; gap: 8px; align-items: center; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .badge.uah { background: var(--uah-dim); color: var(--uah); }
  .badge.eur { background: var(--eur-dim); color: var(--eur); }
  .badge.usd { background: var(--usd-dim); color: var(--usd); }
  .chevron { transition: transform .25s; color: var(--text3); font-size: 12px; }
  .chevron.open { transform: rotate(180deg); }
  .month-details { border-top: 1px solid var(--border); padding: 8px; display: none; }
  .month-details.open { display: block; }
  .month-stat-row { display: flex; justify-content: space-between; padding: 6px 8px; font-size: 13px; }
  .month-stat-label { color: var(--text2); }

  /* SETTINGS */
  .settings-section { margin-bottom: 20px; }
  .settings-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 8px; padding-left: 4px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--bg2); border: 1px solid var(--border); cursor: pointer; }
  .settings-row:first-child { border-radius: var(--r) var(--r) 0 0; }
  .settings-row:last-child { border-radius: 0 0 var(--r) var(--r); }
  .settings-row:only-child { border-radius: var(--r); }
  .settings-row + .settings-row { border-top: none; }
  .settings-row-label { font-size: 15px; font-weight: 500; }
  .settings-row-value { font-size: 14px; color: var(--text2); }
  .settings-row-arrow { color: var(--text3); font-size: 12px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 200; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-sheet { background: var(--bg2); border-radius: 24px 24px 0 0; padding: 20px 20px calc(20px + var(--safe-bottom)); width: 100%; max-height: 85vh; overflow-y: auto; transform: translateY(20px); transition: transform .25s; }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; background: var(--bg4); border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .modal-subtitle { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
  .modal-amount { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin-bottom: 20px; }
  .modal-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .modal-row:last-of-type { border-bottom: none; }
  .modal-row-label { font-size: 14px; color: var(--text2); }
  .modal-row-val { font-size: 14px; font-weight: 600; }
  .btn-danger { width: 100%; padding: 14px; border-radius: var(--r); border: none; background: var(--danger-dim); color: var(--danger); font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: opacity .2s; }
  .btn-danger:active { opacity: 0.7; }
  .btn-secondary { width: 100%; padding: 14px; border-radius: var(--r); border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }

  /* SYNC STATUS */
  .sync-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: 600; }
  .sync-badge.ok { background: rgba(52,199,116,0.12); color: var(--success); }
  .sync-badge.error { background: var(--danger-dim); color: var(--danger); }
  .sync-badge.pending { background: var(--uah-dim); color: var(--uah); }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .sync-dot.pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  /* INSTRUCTIONS */
  .instruction-step { display: flex; gap: 12px; margin-bottom: 16px; }
  .step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--uah-dim); color: var(--uah); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .step-text { font-size: 14px; color: var(--text2); line-height: 1.5; flex: 1; }
  .step-text strong { color: var(--text); }
  .code-block { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; font-family: 'SF Mono', monospace; font-size: 12px; color: var(--uah); margin-top: 6px; word-break: break-all; line-height: 1.6; }

  /* MEMBERS MODAL */
  .member-manage-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .member-manage-item:last-child { border-bottom: none; }
  .member-name-text { font-size: 15px; font-weight: 500; }
  .btn-icon-danger { background: var(--danger-dim); color: var(--danger); border: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .add-member-row { display: flex; gap: 8px; margin-top: 12px; }
  .add-member-row .field-input { flex: 1; }
  .btn-add-member { padding: 13px 16px; background: var(--uah-dim); color: var(--uah); border: 1px solid var(--uah); border-radius: var(--r-sm); font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }

  /* TOAST */
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px); background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 10px 18px; font-size: 14px; font-weight: 600; z-index: 300; transition: transform .3s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* UTILS */
  .text-uah { color: var(--uah); }
  .text-eur { color: var(--eur); }
  .text-usd { color: var(--usd); }
  .mt-8 { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  select.field-input { background-image: none; }

  /* SCROLLABLE SELECT for members */
  .member-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .member-scroll::-webkit-scrollbar { display: none; }
  .member-scroll .member-btn { flex-shrink: 0; }

  .no-data { text-align: center; color: var(--text3); font-size: 14px; padding: 24px; }
  .fw700 { font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <div id="screen" class="screen"></div>
  <nav class="tabs">
    <div class="tab active" data-tab="balance" onclick="navigate('balance')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
      <span>Баланс</span>
    </div>
    <div class="tab" data-tab="add" onclick="navigate('add')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Додати</span>
    </div>
    <div class="tab" data-tab="history" onclick="navigate('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
      <span>Історія</span>
    </div>
    <div class="tab" data-tab="months" onclick="navigate('months')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Місяці</span>
    </div>
    <div class="tab" data-tab="settings" onclick="navigate('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Налаштування</span>
    </div>
  </nav>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-sheet" id="modal-content"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// STATE
// ============================================================
const DEFAULT_STATE = {
  transactions: [],
  members: ['Я', 'Дружина', 'Дитина'],
  syncUrl: '',
  lastSync: null,
  rates: null,
  ratesUpdated: null,
  rateSource: null,
};

let state = loadState();
let currentTab = 'balance';
let addForm = { type: 'expense', currency: 'UAH', amount: '', comment: '', member: '', date: today() };
let historyFilter = { type: 'all', currency: 'all' };
let syncInProgress = false;

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('fwallet_v2') || 'null');
    return s ? { ...DEFAULT_STATE, ...s } : { ...DEFAULT_STATE };
  } catch { return { ...DEFAULT_STATE }; }
}

function saveState() {
  localStorage.setItem('fwallet_v2', JSON.stringify(state));
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

// ============================================================
// NAVIGATION
// ============================================================
function navigate(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  render();
}

function render() {
  const el = document.getElementById('screen');
  if (currentTab === 'balance') el.innerHTML = renderBalance();
  else if (currentTab === 'add') el.innerHTML = renderAdd();
  else if (currentTab === 'history') el.innerHTML = renderHistory();
  else if (currentTab === 'months') el.innerHTML = renderMonths();
  else if (currentTab === 'settings') el.innerHTML = renderSettings();
  bindEvents();
}

// RATES
// ============================================================
async function fetchRates() {
  // Try PrivatBank first
  try {
    const r = await fetch('https://api.privatbank.ua/p24api/pubinfo?json&exchange&coursid=5', { signal: AbortSignal.timeout(5000) });
    const data = await r.json();
    const rates = {};
    data.forEach(item => {
      if (item.ccy === 'EUR') rates.EUR = { buy: parseFloat(item.buy), sale: parseFloat(item.sale) };
      if (item.ccy === 'USD') rates.USD = { buy: parseFloat(item.buy), sale: parseFloat(item.sale) };
    });
    if (rates.EUR && rates.USD) {
      state.rates = rates;
      state.ratesUpdated = Date.now();
      state.rateSource = 'ПриватБанк';
      saveState();
      return rates;
    }
  } catch {}

  // Fallback: Monobank
  try {
    const r = await fetch('https://api.monobank.ua/bank/currency', { signal: AbortSignal.timeout(5000) });
    const data = await r.json();
    const rates = {};
    data.forEach(item => {
      if (item.currencyCodeA === 978 && item.currencyCodeB === 980)
        rates.EUR = { buy: item.rateBuy, sale: item.rateSell };
      if (item.currencyCodeA === 840 && item.currencyCodeB === 980)
        rates.USD = { buy: item.rateBuy, sale: item.rateSell };
    });
    if (rates.EUR && rates.USD) {
      state.rates = rates;
      state.ratesUpdated = Date.now();
      state.rateSource = 'Monobank';
      saveState();
      return rates;
    }
  } catch {}

  return state.rates || null;
}

async function refreshRates() {
  await fetchRates();
  if (currentTab === 'balance') render();
}

function calcBalance() {
  const b = { UAH: 0, EUR: 0, USD: 0 };
  state.transactions.forEach(t => {
    const sign = t.type === 'income' ? 1 : -1;
    b[t.currency] += sign * t.amount;
  });
  return b;
}

function fmtAmount(n, cur) {
  const sym = { UAH: '₴', EUR: '€', USD: '$' };
  const abs = Math.abs(n);
  const formatted = abs >= 1000
    ? abs.toLocaleString('uk-UA', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : abs.toFixed(2);
  return sym[cur] + '\u00a0' + formatted;
}

function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('uk-UA', { day: 'numeric', month: 'short', year: 'numeric' });
}

function setType(t) { addForm.type = t; render(); }
function setCur(c) { addForm.currency = c; render(); }
function setMember(m) { addForm.member = m; render(); }

function submitAdd() {
  const amount = parseFloat(addForm.amount);
  if (!amount || amount <= 0) { showToast('Введіть суму', 'error'); return; }
  if (!addForm.comment.trim()) { showToast('Введіть коментар', 'error'); return; }
  const txn = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2),
    type: addForm.type,
    currency: addForm.currency,
    amount,
    comment: addForm.comment.trim(),
    member: addForm.member || '',
    date: addForm.date || today(),
    created: Date.now()
  };
  state.transactions.push(txn);
  saveState();
  addForm = { type: 'expense', currency: addForm.currency, amount: '', comment: '', member: addForm.member, date: today() };
  showToast('Запис додано ✓', 'success');
  autoSync();
  render();
}

function txnItemHtml(t) {
  const sign = t.type === 'income' ? '+' : '-';

  return `
    <div class="txn-item" onclick="openTxnModal('${t.id}')">
      <div class="txn-icon ${t.type}">${icon}</div>
      <div class="txn-info">
        <div class="txn-comment">${escHtml(t.comment)}</div>
        <div class="txn-meta">${fmtDate(t.date)}${t.member ? ' · ' + escHtml(t.member) : ''}</div>
      </div>
      <div class="txn-amount ${t.type}">${sign}${fmtAmount(t.amount, t.currency)}</div>
    </div>`;
}

function renderHistory() {
  let txns = [...state.transactions].reverse();

  if (historyFilter.type !== 'all') txns = txns.filter(t => t.type === historyFilter.type);
  if (historyFilter.currency !== 'all') txns = txns.filter(t => t.currency === historyFilter.currency);

  const typeChips = ['all','income','expense'].map(v => {
    const labels = { all: 'Всі', income: 'Доходи', expense: 'Витрати' };
    return `<div class="filter-chip${historyFilter.type===v?' active':''}" data-val="${v}" onclick="setHistFilter('type','${v}')">${labels[v]}</div>`;
  }).join('');

  const curChips = ['all','UAH','EUR','USD'].map(v => {
    const labels = { all: 'Всі валюти', UAH: '₴ UAH', EUR: '€ EUR', USD: '$ USD' };
    return `<div class="filter-chip${historyFilter.currency===v?' active':''}" data-val="${v}" onclick="setHistFilter('currency','${v}')">${labels[v]}</div>`;
  }).join('');

  const listHtml = txns.length
    ? txns.map(t => txnItemHtml(t)).join('')
    : `<div class="empty-state"><div class="empty-icon">📭</div>Немає записів</div>`;

  return `
    <div class="page-header"><div class="page-title">Історія</div></div>
    <div class="filter-row">${typeChips}</div>
    <div class="filter-row">${curChips}</div>
    ${listHtml}
  `;
}

function setHistFilter(key, val) { historyFilter[key] = val; render(); }

// ============================================================
// MONTHS
// ============================================================
function renderMonths() {
  if (!state.transactions.length) return `
    <div class="page-header"><div class="page-title">По місяцях</div></div>
    <div class="empty-state"><div class="empty-icon">📅</div>Немає даних</div>`;

  // Group by year-month
  const groups = {};
  state.transactions.forEach(t => {
    const key = t.date.slice(0, 7);
    if (!groups[key]) groups[key] = [];
    groups[key].push(t);
  });

  const sortedKeys = Object.keys(groups).sort().reverse();

  const html = sortedKeys.map(key => {
    const txns = groups[key];
    const [year, mon] = key.split('-');
    const monthName = new Date(+year, +mon - 1).toLocaleDateString('uk-UA', { month: 'long', year: 'numeric' });

    const totals = { UAH: { income: 0, expense: 0 }, EUR: { income: 0, expense: 0 }, USD: { income: 0, expense: 0 } };
    txns.forEach(t => { totals[t.currency][t.type] += t.amount; });

    const badges = ['UAH','EUR','USD'].filter(c => totals[c].income + totals[c].expense > 0).map(c => {
      const net = totals[c].income - totals[c].expense;
      const sym = { UAH: '₴', EUR: '€', USD: '$' }[c];
      return `<span class="badge ${c.toLowerCase()}">${net >= 0 ? '+' : ''}${sym}${Math.abs(net).toFixed(0)}</span>`;
    }).join('');

    const detailRows = ['UAH','EUR','USD'].filter(c => totals[c].income + totals[c].expense > 0).map(c => {
      const sym = { UAH: '₴', EUR: '€', USD: '$' }[c];
      return `
        <div class="month-stat-row"><span class="month-stat-label">${c} Доходи</span><span style="color:var(--success);font-weight:600">+${sym}${totals[c].income.toFixed(2)}</span></div>
        <div class="month-stat-row"><span class="month-stat-label">${c} Витрати</span><span style="color:var(--danger);font-weight:600">-${sym}${totals[c].expense.toFixed(2)}</span></div>
      `;
    }).join('');

    const txnList = [...txns].reverse().slice(0, 5).map(t => txnItemHtml(t)).join('');
    const more = txns.length > 5 ? `<div style="text-align:center;padding:8px;font-size:13px;color:var(--text3)">+ ще ${txns.length-5} записів</div>` : '';

    return `
      <div class="month-group">
        <div class="month-header" onclick="toggleMonth('${key}')">
          <div class="month-title">${monthName}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="month-badges">${badges}</div>
            <div class="chevron" id="chev-${key}">▼</div>
          </div>
        </div>
        <div class="month-details" id="mdet-${key}">
          ${detailRows}
          <div style="padding:8px 0 0;border-top:1px solid var(--border);margin-top:8px">
            ${txnList}${more}
          </div>
        </div>
      </div>`;
  }).join('');

  return `<div class="page-header"><div class="page-title">По місяцях</div></div>${html}`;
}

function toggleMonth(key) {
  const det = document.getElementById('mdet-' + key);
  const chev = document.getElementById('chev-' + key);
  if (!det) return;
  det.classList.toggle('open');
  chev.classList.toggle('open');
}

function openModal(html) {
  document.getElementById('modal-content').innerHTML = `<div class="modal-handle"></div>${html}`;
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('open');
}

function closeModalDirect() {
  document.getElementById('modal').classList.remove('open');
}

function openTxnModal(id) {
  const t = state.transactions.find(x => x.id === id);
  if (!t) return;
  const sign = t.type === 'income' ? '+' : '-';
  const clr = t.type === 'income' ? 'var(--success)' : 'var(--danger)';
  openModal(`
    <div class="modal-title">${escHtml(t.comment)}</div>
    <div class="modal-amount" style="color:${clr}">${sign}${fmtAmount(t.amount, t.currency)}</div>
    <div class="modal-row"><span class="modal-row-label">Тип</span><span class="modal-row-val">${t.type==='income'?'Дохід':'Витрата'}</span></div>
    <div class="modal-row"><span class="modal-row-label">Валюта</span><span class="modal-row-val">${t.currency}</span></div>
    <div class="modal-row"><span class="modal-row-label">Дата</span><span class="modal-row-val">${fmtDate(t.date)}</span></div>
    ${t.member ? `<div class="modal-row"><span class="modal-row-label">Хто</span><span class="modal-row-val">${escHtml(t.member)}</span></div>` : ''}
    <button class="btn-danger" onclick="deleteTxn('${t.id}')">Видалити запис</button>
    <button class="btn-secondary" onclick="closeModalDirect()">Закрити</button>
  `);
}

function deleteTxn(id) {
  state.transactions = state.transactions.filter(t => t.id !== id);
  saveState();
  closeModalDirect();
  showToast('Запис видалено', 'success');
  autoSync();
  render();
}

function openMembersModal() {
  renderMembersModal();
}

function renderMembersModal() {
  const items = state.members.map((m, i) => `
    <div class="member-manage-item">
      <span class="member-name-text">${escHtml(m)}</span>
      <button class="btn-icon-danger" onclick="deleteMember(${i})">Видалити</button>

      <button class="btn-add-member" onclick="addMember()">Додати</button>
    </div>
  `);
}

function addMember() {
  const inp = document.getElementById('new-member-inp');
  const name = inp ? inp.value.trim() : '';
  if (!name) return;
  if (state.members.length >= 5) { showToast('Максимум 5 осіб', 'error'); return; }
  if (state.members.includes(name)) { showToast('Вже є', 'error'); return; }
  state.members.push(name);
  saveState();
  renderMembersModal();
}

function deleteMember(idx) {
  state.members.splice(idx, 1);
  saveState();
  renderMembersModal();
}

  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const sh = ss.getSheetByName('Data') || ss.insertSheet('Data');
  const data = JSON.parse(e.postData.contents);
  if (data.action === 'push') {
    sh.clearContents();
    sh.appendRow(['id','type','currency','amount','comment','member','date','created']);
    data.transactions.forEach(t => sh.appendRow([t.id,t.type,t.currency,t.amount,t.comment,t.member,t.date,t.created]));
    return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
  }
  if (data.action === 'pull') {
    const rows = sh.getDataRange().getValues();
    const headers = rows[0];
    const transactions = rows.slice(1).map(r => Object.fromEntries(headers.map((h,i)=>[h,r[i]])));
    return ContentService.createTextOutput(JSON.stringify({ok:true,transactions})).setMimeType(ContentService.MimeType.JSON);
  }
}
function doGet(e) { return doPost(e); }</div>

// ============================================================
// SYNC
// ============================================================
async function autoSync() {
  if (!state.syncUrl || syncInProgress) return;
  syncInProgress = true;
  try {
    await fetch(state.syncUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'push', transactions: state.transactions })
    });
    state.lastSync = Date.now();
    saveState();
  } catch {}
  syncInProgress = false;
}

async function manualSync() {
  if (!state.syncUrl) { openSyncModal(); return; }
  showToast('Синхронізація...', 'pending');
  syncInProgress = true;
  try {
    // Pull
    const r = await fetch(state.syncUrl + '?action=pull', { mode: 'cors', signal: AbortSignal.timeout(10000) });
    const data = await r.json();
    if (data.ok && Array.isArray(data.transactions)) {
      // Merge: combine remote + local, deduplicate by id
      const map = {};
      data.transactions.forEach(t => { if (t.id) map[t.id] = { ...t, amount: parseFloat(t.amount) || 0 }; });
      state.transactions.forEach(t => { if (t.id) map[t.id] = t; });
      state.transactions = Object.values(map).sort((a, b) => (a.date > b.date ? 1 : -1));
    }
    // Push merged
    await fetch(state.syncUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'push', transactions: state.transactions })
    });
    state.lastSync = Date.now();
    saveState();
    showToast('Синхронізовано ✓', 'success');
    render();
  } catch (err) {
    showToast('Помилка синхронізації', 'error');
  }
  syncInProgress = false;
}

// ============================================================
// BACKUP
// ============================================================
function exportBackup() {
  const data = JSON.stringify({ ...state, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wallet-backup-${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Резервна копія збережена', 'success');
}

function importBackup() {
  document.getElementById('import-file') && document.getElementById('import-file').click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.transactions) {
        state = { ...DEFAULT_STATE, ...data };
        saveState();
        showToast('Імпортовано ✓', 'success');
        render();
      }
    } catch { showToast('Помилка файлу', 'error'); }
  };
  reader.readAsText(file);
}

function confirmClear() {
  openModal(`
    <div class="modal-title">Очистити всі дані?</div>
    <div class="modal-subtitle" style="margin-bottom:24px">Це видалить всі транзакції. Дію неможливо скасувати.</div>
    <button class="btn-danger" onclick="clearAll()">Так, очистити</button>
    <button class="btn-secondary" onclick="closeModalDirect()">Скасувати</button>
  `);
}

function clearAll() {
  state.transactions = [];
  saveState();
  closeModalDirect();
  showToast('Дані очищено', 'success');
  render();
}

// ============================================================
// UTILS
// ============================================================
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

function bindEvents() {}

// ============================================================
// INIT
// ============================================================
(async function init() {
  render();
  // Auto-fetch rates if stale (>10 min)
  const stale = !state.ratesUpdated || Date.now() - state.ratesUpdated > 600000;
  if (stale) {
    await fetchRates();
    if (currentTab === 'balance') render();
  }
  // Service Worker for PWA
  if ('serviceWorker' in navigator) {
    const sw = `
      const CACHE='fwallet-v1';
      self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['/']))));
      self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));
    `;
    const blob = new Blob([sw], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }
})();
</script>
